name: Build graphics layers

# DXMT (D3D10/11 -> Metal) and DXVK-macOS (D3D9/10/11 -> Vulkan -> MoltenVK), built
# against our CrossOver Wine and smoke-tested with it. Versions are pinned in
# scripts/build-dxmt.sh and scripts/build-dxvk.sh. Artifact layout: docs/ARTIFACTS.md.

on:
  workflow_dispatch:
    inputs:
      crossover_version:
        description: CrossOver Wine version to build DXMT against (and smoke-test with)
        required: true
        default: "26.3.0"

# Least privilege: the jobs only need to read the repo.
permissions:
  contents: read

concurrency:
  group: build-graphics-${{ github.ref }}
  cancel-in-progress: false

env:
  CX_VERSION: ${{ inputs.crossover_version }}

jobs:
  # DXMT links winemetal against Wine's import libs, winebuild, ntdll.so and winemac.so,
  # which the runtime tarball from build-wine.yml does not ship. Build Wine here with
  # WINE_DEVEL=1 (same script, same version), cached on the script's hash.
  wine:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Validate input
        run: '[[ "$CX_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "bad version: $CX_VERSION"; exit 1; }'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Cache Wine build
        id: wine-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/dist/wine-crossover-*.tar.xz
          key: wine-dist-${{ env.CX_VERSION }}-${{ hashFiles('scripts/build-wine.sh') }}

      - name: Ensure Rosetta 2
        if: steps.wine-cache.outputs.cache-hit != 'true'
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Cache downloads
        if: steps.wine-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/mac-gaming
          key: downloads-${{ env.CX_VERSION }}

      - name: Build Wine (runtime + devel)
        if: steps.wine-cache.outputs.cache-hit != 'true'
        env:
          WINE_DEVEL: "1"
        run: scripts/build-wine.sh "$CX_VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wine-sdk
          path: build/dist/wine-crossover-*.tar.xz
          retention-days: 3
          if-no-files-found: error

  llvm:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Cache LLVM
        id: llvm-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/llvm-x86_64
          key: llvm-15.0.7-x86_64-${{ hashFiles('scripts/build-llvm.sh') }}

      - name: Select Xcode
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: scripts/ci-select-xcode.sh

      - name: Ensure Rosetta 2
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Build LLVM 15 (x86_64)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: scripts/build-llvm.sh ~/llvm-x86_64

  dxmt:
    needs: [wine, llvm]
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      name: ${{ steps.build.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Restore LLVM
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/llvm-x86_64
          key: llvm-15.0.7-x86_64-${{ hashFiles('scripts/build-llvm.sh') }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wine-sdk
          path: build/wine-sdk-dl

      - name: Select Xcode
        run: scripts/ci-select-xcode.sh

      - name: Ensure Rosetta 2
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Unpack Wine SDK
        run: |
          mkdir -p build/wine-sdk
          tar -xJf "build/wine-sdk-dl/wine-crossover-$CX_VERSION-wow64.tar.xz" -C build/wine-sdk --strip-components=1
          tar -xJf "build/wine-sdk-dl/wine-crossover-$CX_VERSION-wow64-devel.tar.xz" -C build/wine-sdk --strip-components=1

      - name: Build DXMT
        id: build
        run: LLVM_PREFIX="$HOME/llvm-x86_64" scripts/build-dxmt.sh build/wine-sdk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: build/dist/dxmt-*.tar.xz
          if-no-files-found: error

  dxvk:
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      name: ${{ steps.build.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build DXVK-macOS
        id: build
        run: scripts/build-dxvk.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: build/dist/dxvk-macos-*.tar.xz
          if-no-files-found: error

  smoke-test:
    needs: [wine, dxmt, dxvk]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Ensure Rosetta 2
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wine-sdk
          path: build/in

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.dxmt.outputs.name }}
          path: build/in

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.dxvk.outputs.name }}
          path: build/in

      - name: Smoke test (DXMT and DXVK under our Wine)
        env:
          DXMT_NAME: ${{ needs.dxmt.outputs.name }}
          DXVK_NAME: ${{ needs.dxvk.outputs.name }}
        run: |
          scripts/smoke-test-graphics.sh \
            "build/in/wine-crossover-$CX_VERSION-wow64.tar.xz" \
            "build/in/$DXMT_NAME.tar.xz" \
            "build/in/$DXVK_NAME.tar.xz"

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-test-logs
          path: build/smoke/*.log
          retention-days: 14
          if-no-files-found: ignore
