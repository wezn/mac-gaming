name: Build Wine

on:
  workflow_dispatch:
    inputs:
      crossover_version:
        description: CrossOver source version (see codeweavers.com/crossover/source)
        required: true
        default: "26.3.0"

# Least privilege: the job only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: build-wine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # GitHub-hosted Apple Silicon VM: free on public repos, and nothing runs on a personal machine.
    runs-on: macos-15
    timeout-minutes: 360
    env:
      CX_VERSION: ${{ inputs.crossover_version }}
    steps:
      - name: Validate input
        run: '[[ "$CX_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "bad version: $CX_VERSION"; exit 1; }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure Rosetta 2
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Cache downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/mac-gaming
          key: downloads-${{ env.CX_VERSION }}

      - name: Build
        run: scripts/build-wine.sh "$CX_VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wine-crossover-${{ env.CX_VERSION }}-wow64
          path: build/dist/*.tar.xz
