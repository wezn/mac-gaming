name: Launcher

on:
  push:
    branches: [main]
  # Any base branch, so stacked PRs (based on another PR's branch) get CI and an mg build
  # too. Never pull_request_target: this workflow runs PR code.
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read the repo unless they say otherwise.
permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: launcher/.build
          key: spm-${{ runner.os }}-${{ hashFiles('launcher/Package.resolved') }}

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test --parallel

      - name: CLI sanity
        env:
          MG_HOME: ${{ runner.temp }}/mg-sanity
        run: |
          .build/release/mg --version
          .build/release/mg detect Tests/MGCoreTests/Fixtures/dx12.exe | grep -q "DirectX 12"
          # No runtime installed, so doctor reports an error (exit 1); the JSON must still parse.
          code=0; .build/release/mg doctor --json > "$RUNNER_TEMP/doctor.json" || code=$?
          [[ "$code" == 1 ]] || { echo "::error::expected mg doctor to exit 1 on an empty root, got $code"; exit 1; }
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); assert d["ok"] is False and d["checks"], d' "$RUNNER_TEMP/doctor.json"
          .build/release/mg report -o "$RUNNER_TEMP/report.tar.gz"
          tar -tzf "$RUNNER_TEMP/report.tar.gz" | grep -q '/doctor.json$'

      # A ready-to-run binary for testers, so they don't need Xcode. It is unsigned (only the
      # linker's ad-hoc signature): see docs/TESTING.md for the Gatekeeper step. Packed as a
      # tarball because artifact zips drop the executable bit.
      - name: Package mg
        id: package
        run: |
          bin=.build/release/mg
          archs=$(lipo -archs "$bin")
          [[ "$archs" == *arm64* ]] || { echo "::error::mg is not arm64 ($archs)"; exit 1; }
          codesign -dv "$bin" 2>&1 | grep -E '^(Identifier|Signature|CodeDirectory)' || true
          out="$RUNNER_TEMP/mg-dist"
          mkdir -p "$out"
          tar -czf "$out/mg-macos-arm64.tar.gz" -C .build/release mg
          (cd "$out" && shasum -a 256 mg-macos-arm64.tar.gz | tee mg-macos-arm64.tar.gz.sha256)
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Upload mg binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mg-macos-arm64
          path: ${{ steps.package.outputs.dir }}
          if-no-files-found: error
          retention-days: 30

  app:
    # Builds MacGaming.app, checks that it starts and stays up headlessly, takes screenshots,
    # and uploads the (ad-hoc signed, not notarized) app so it can be tried.
    name: Build the app (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: launcher/.build
          key: spm-app-${{ runner.os }}-${{ hashFiles('launcher/Package.resolved') }}

      - name: Build mg and MacGaming.app
        working-directory: launcher
        run: |
          swift build -c release --product mg
          BUILD_NUMBER="$GITHUB_RUN_NUMBER" Scripts/make_app.sh

      - name: Inspect the bundle
        working-directory: launcher
        run: |
          app=build/MacGaming.app
          find "$app" -maxdepth 3 -print
          plutil -p "$app/Contents/Info.plist"
          codesign -dv "$app" 2>&1
          file "$app/Contents/MacOS/MacGaming"
          test -x "$app/Contents/MacOS/MacGaming"

      - name: Seed a demo mg root
        run: |
          echo "MG_HOME=$RUNNER_TEMP/mg-demo" >> "$GITHUB_ENV"
          export MG_HOME="$RUNNER_TEMP/mg-demo"
          mg=launcher/.build/release/mg
          # A fake runtime (wine just exits): enough for planning and for the UI to have content.
          rt="$RUNNER_TEMP/demo-runtime"
          mkdir -p "$rt/wine/bin" "$rt/wine/lib" "$rt/dxmt/x86_64-windows" "$rt/dxmt/i386-windows" \
                   "$rt/dxmt/x86_64-unix" "$rt/dxvk/x64" "$rt/dxvk/x32"
          printf '#!/bin/sh\nexit 0\n' > "$rt/wine/bin/wine"
          cp "$rt/wine/bin/wine" "$rt/wine/bin/wineserver"
          chmod +x "$rt/wine/bin/wine" "$rt/wine/bin/wineserver"
          touch "$rt/wine/lib/libMoltenVK.dylib" "$rt/dxmt/x86_64-unix/winemetal.so"
          for f in d3d11 dxgi d3d10core winemetal; do
            touch "$rt/dxmt/x86_64-windows/$f.dll" "$rt/dxmt/i386-windows/$f.dll"
          done
          for f in d3d9 d3d10core d3d11 dxgi; do touch "$rt/dxvk/x64/$f.dll" "$rt/dxvk/x32/$f.dll"; done
          $mg runtime install "$rt" --name crossover-demo
          $mg bottle create overwatch --no-init --backend d3dmetal --set-default
          $mg bottle create cs2 --no-init --backend dxmt --env DXMT_LOG_LEVEL=info --retina
          $mg bottle create sandbox --no-init
          mkdir -p "$RUNNER_TEMP/Games/Demo"
          cp launcher/Tests/MGCoreTests/Fixtures/dx11.exe "$RUNNER_TEMP/Games/Demo/Demo.exe"
          $mg bottle list

      - name: Launch headlessly and take screenshots
        run: |
          app=launcher/build/MacGaming.app/Contents/MacOS/MacGaming
          shots="$RUNNER_TEMP/screenshots"
          mkdir -p "$shots"
          # Each launch must stay up for 8 s (an early exit or crash fails the step), then a
          # screenshot is taken. -MGInitialSection / -MGPreviewRun pick what the window shows.
          shoot() {
            local name=$1; shift
            "$app" "$@" > "$shots/$name.log" 2>&1 &
            local pid=$!
            for _ in $(seq 1 8); do
              if ! kill -0 "$pid" 2>/dev/null; then
                code=0; wait "$pid" || code=$?
                echo "::error::MacGaming exited early ($name, exit code $code)"
                cat "$shots/$name.log"
                exit 1
              fi
              sleep 1
            done
            screencapture -x "$shots/$name.png" || echo "::warning::screencapture failed for $name"
            kill "$pid"
            wait "$pid" 2>/dev/null || true
            echo "$name: stayed up for 8 s"
          }
          shoot bottle -MGInitialSection bottle:overwatch
          shoot run-plan -MGInitialSection bottle:sandbox -MGPreviewRun "$RUNNER_TEMP/Games/Demo/Demo.exe"
          shoot runtimes -MGInitialSection runtimes
          shoot doctor -MGInitialSection doctor
          shoot logs -MGInitialSection logs
          ls -l "$shots"

      - name: Package the app
        working-directory: launcher/build
        run: ditto -c -k --keepParent MacGaming.app MacGaming.zip

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MacGaming-app
          path: launcher/build/MacGaming.zip
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  smoke:
    # Runs mg against the real Wine build from the latest successful "Build Wine" run and the
    # real DXMT / DXVK-macOS builds from the latest successful "Build graphics layers" run.
    name: Smoke test with real Wine
    needs: test
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # download the artifacts of other workflow runs
    defaults:
      run:
        shell: bash # -eo pipefail
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use a throwaway mg root
        run: echo "MG_HOME=$RUNNER_TEMP/mg" >> "$GITHUB_ENV"

      - name: Ensure Rosetta 2
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: launcher/.build
          key: spm-${{ runner.os }}-${{ hashFiles('launcher/Package.resolved') }}

      - name: Build mg
        working-directory: launcher
        run: swift build -c release

      - name: Download the latest Wine artifact
        id: wine
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run_id=$(gh run list --repo "$REPO" --workflow build-wine.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "::warning::No successful Build Wine run yet; skipping the smoke test"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using Build Wine run $run_id"
          gh run download "$run_id" --repo "$REPO" --pattern 'wine-crossover-*' --dir "$RUNNER_TEMP/wine-artifact"
          ls -lR "$RUNNER_TEMP/wine-artifact"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Install runtime and create a bottle
        if: steps.wine.outputs.found == 'true'
        run: |
          mg=launcher/.build/release/mg
          $mg runtime install "$RUNNER_TEMP/wine-artifact"
          $mg runtime list
          $mg bottle create test
          $mg bottle list
          $mg doctor || true

      - name: Run a console program
        if: steps.wine.outputs.found == 'true'
        run: |
          mg=launcher/.build/release/mg
          $mg run --bottle test --backend wined3d cmd.exe /c echo mg-smoke-ok
          $mg logs --last
          $mg logs --last | grep -q mg-smoke-ok

      - name: HTTPS from inside Wine (schannel / GnuTLS)
        if: steps.wine.outputs.found == 'true'
        run: |
          # Battle.net and Steam need TLS through WinHTTP/WinINet, which Wine implements on top of
          # GnuTLS. Without it they say "no internet". Any HTTP status means the handshake worked.
          mg=launcher/.build/release/mg
          js="$RUNNER_TEMP/https.js"
          cat > "$js" <<'JS'
          var urls = ["https://www.battle.net/", "https://store.steampowered.com/"];
          var failed = 0;
          for (var i = 0; i < urls.length; i++) {
            try {
              var r = new ActiveXObject("WinHttp.WinHttpRequest.5.1");
              r.Open("GET", urls[i], false);
              r.Send();
              WScript.Echo("mg-https-ok " + r.Status + " " + urls[i]);
            } catch (e) {
              WScript.Echo("mg-https-fail " + urls[i] + ": " + e.message);
              failed++;
            }
          }
          WScript.Quit(failed);
          JS
          winpath="Z:${js//\//\\}"
          code=0
          $mg run --bottle test --backend wined3d --debug err+all,+winediag cscript.exe //nologo "$winpath" || code=$?
          $mg logs --last
          if (( code != 0 )) || ! $mg logs --last | grep -q 'mg-https-ok'; then
            echo "::error::HTTPS inside Wine failed (cscript exit $code); see the log above (look for libgnutls / schannel)"
            exit 1
          fi

      - name: Run notepad.exe headlessly
        if: steps.wine.outputs.found == 'true'
        run: |
          mg=launcher/.build/release/mg
          $mg run --bottle test --backend wined3d notepad.exe &
          pid=$!
          # notepad never exits on its own, so "still running after 30 s" means it started and
          # stayed up. An early exit (missing libs, mac driver failure) fails the step.
          alive=true
          for _ in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then alive=false; break; fi
            sleep 1
          done
          pgrep -fl 'notepad.exe' || true
          $mg bottle stop test || true
          for _ in $(seq 1 30); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          kill -9 "$pid" 2>/dev/null || true
          $mg logs --last
          if [[ "$alive" != true ]]; then
            code=0; wait "$pid" || code=$?
            echo "::error::notepad.exe exited early (mg exit code $code)"; exit 1
          fi

      - name: Download the latest DXMT and DXVK artifacts
        id: gfx
        if: steps.wine.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # gh exits non-zero if the workflow does not exist (yet) on this repo.
          run_id=$(gh run list --repo "$REPO" --workflow build-graphics.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [[ -z "$run_id" ]]; then
            echo "::warning::No successful Build graphics layers run yet; skipping the DXMT/DXVK smoke test"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using Build graphics layers run $run_id"
          # One folder per artifact: dxmt-<v>/dxmt-<v>.tar.xz, dxvk-macos-<v>/dxvk-macos-<v>.tar.xz.
          gh run download "$run_id" --repo "$REPO" --pattern 'dxmt-*' --pattern 'dxvk-macos-*' --dir "$RUNNER_TEMP/gfx-artifact"
          ls -lR "$RUNNER_TEMP/gfx-artifact"
          for p in 'dxmt-*.tar.xz' 'dxvk-macos-*.tar.xz'; do
            n=$(find "$RUNNER_TEMP/gfx-artifact" -name "$p" | wc -l)
            if (( n != 1 )); then echo "::error::expected one $p in run $run_id, found $n"; exit 1; fi
          done
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Install DXMT and DXVK
        if: steps.gfx.outputs.found == 'true'
        run: |
          mg=launcher/.build/release/mg
          # Graphics-only install: goes into the default runtime installed above.
          $mg runtime install "$RUNNER_TEMP/gfx-artifact"
          $mg runtime list | tee "$RUNNER_TEMP/runtime-list.txt"
          grep -Eq '^\* .*dxmt [0-9]' "$RUNNER_TEMP/runtime-list.txt" || { echo "::error::mg runtime list shows no DXMT"; exit 1; }
          grep -Eq '^\* .*dxvk [0-9]' "$RUNNER_TEMP/runtime-list.txt" || { echo "::error::mg runtime list shows no DXVK"; exit 1; }

          $mg doctor | tee "$RUNNER_TEMP/doctor.txt" || true # warnings (no GPTK) are expected
          grep -q 'winemetal integrated' "$RUNNER_TEMP/doctor.txt" || { echo "::error::mg doctor: DXMT's winemetal is not integrated"; exit 1; }
          grep -Eq '^✓ runtime .*: DXMT [0-9]' "$RUNNER_TEMP/doctor.txt" || { echo "::error::mg doctor: DXMT not OK"; exit 1; }
          grep -Eq '^✓ runtime .*: DXVK [0-9]' "$RUNNER_TEMP/doctor.txt" || { echo "::error::mg doctor: DXVK not OK"; exit 1; }
          if grep -q 'DXMT built for another Wine' "$RUNNER_TEMP/doctor.txt"; then
            echo "::warning::DXMT was built against a different Wine than the Build Wine artifact (see mg doctor)"
          fi

          # The files themselves: DXMT merged into wine-dxmt/, wine/ left stock.
          rt=$(dirname "$(find "$MG_HOME/runtimes" -mindepth 2 -maxdepth 2 -name dxmt -type d)")
          echo "RT=$rt" >> "$GITHUB_ENV"
          for f in x86_64-windows/d3d11.dll x86_64-windows/dxgi.dll x86_64-windows/d3d10core.dll x86_64-windows/winemetal.dll \
                   i386-windows/d3d11.dll i386-windows/dxgi.dll i386-windows/d3d10core.dll i386-windows/winemetal.dll \
                   x86_64-unix/winemetal.so; do
            cmp "$rt/dxmt/$f" "$rt/wine-dxmt/lib/wine/$f"
          done
          if [[ -e "$rt/wine/lib/wine/x86_64-unix/winemetal.so" ]] || cmp -s "$rt/dxmt/x86_64-windows/d3d11.dll" "$rt/wine/lib/wine/x86_64-windows/d3d11.dll"; then
            echo "::error::DXMT leaked into the stock wine/ tree"; exit 1
          fi

      - name: Dry runs against the DX11 / DX9 fixtures
        if: steps.gfx.outputs.found == 'true'
        run: |
          mg=launcher/.build/release/mg
          fx=launcher/Tests/MGCoreTests/Fixtures
          fail() { echo "::error::$*"; exit 1; }

          for args in "--backend dxmt $fx/dx11.exe" "$fx/dx11.exe"; do
            # shellcheck disable=SC2086 # word splitting intended
            $mg run --bottle test --dry-run $args | tee "$RUNNER_TEMP/plan.txt"
            grep -q '^backend:   dxmt ' "$RUNNER_TEMP/plan.txt" || fail "dx11.exe ($args) did not plan DXMT"
            grep -q '^detected:  DirectX 11' "$RUNNER_TEMP/plan.txt" || fail "dx11.exe not detected as DirectX 11"
            grep -q "^command:   $RT/wine-dxmt/bin/wine " "$RUNNER_TEMP/plan.txt" || fail "DXMT does not run from wine-dxmt/"
            [[ "$(grep -c '^copy:' "$RUNNER_TEMP/plan.txt")" == 2 ]] || fail "DXMT should copy exactly 2 DLLs"
            grep -q "^copy:      $RT/dxmt/x86_64-windows/winemetal.dll -> $MG_HOME/bottles/test/drive_c/windows/system32/winemetal.dll$" "$RUNNER_TEMP/plan.txt" || fail "64-bit winemetal copy missing"
            grep -q "^copy:      $RT/dxmt/i386-windows/winemetal.dll -> $MG_HOME/bottles/test/drive_c/windows/syswow64/winemetal.dll$" "$RUNNER_TEMP/plan.txt" || fail "32-bit winemetal copy missing"
            grep -qx '  WINEDLLOVERRIDES=d3d10,d3d10_1,d3d10core,d3d11,d3d12,d3d12core,d3d8,d3d9,dxgi,winemetal=b' "$RUNNER_TEMP/plan.txt" || fail "unexpected DXMT WINEDLLOVERRIDES"
          done

          for args in "--backend dxvk $fx/dx9.exe" "$fx/dx9.exe" "--backend dxvk $fx/dx11.exe"; do
            # shellcheck disable=SC2086
            $mg run --bottle test --dry-run $args | tee "$RUNNER_TEMP/plan.txt"
            grep -q '^backend:   dxvk ' "$RUNNER_TEMP/plan.txt" || fail "$args did not plan DXVK"
            grep -q "^command:   $RT/wine/bin/wine " "$RUNNER_TEMP/plan.txt" || fail "DXVK does not run from stock wine/"
            for d in d3d9 d3d10core d3d11 dxgi; do
              grep -q "^copy:      $RT/dxvk/x64/$d.dll -> $MG_HOME/bottles/test/drive_c/windows/system32/$d.dll$" "$RUNNER_TEMP/plan.txt" || fail "x64/$d.dll copy missing"
              grep -q "^copy:      $RT/dxvk/x32/$d.dll -> $MG_HOME/bottles/test/drive_c/windows/syswow64/$d.dll$" "$RUNNER_TEMP/plan.txt" || fail "x32/$d.dll copy missing"
            done
            grep -qx '  WINEDLLOVERRIDES=d3d10,d3d10_1,d3d12,d3d12core,d3d8=b;d3d10core,d3d11,d3d9,dxgi=n,b' "$RUNNER_TEMP/plan.txt" || fail "unexpected DXVK WINEDLLOVERRIDES"
          done
          grep -q '^detected:  DirectX 9' <($mg run --bottle test --dry-run "$fx/dx9.exe") || fail "dx9.exe not detected as DirectX 9"

      - name: Run with DXMT and DXVK (no rendering)
        if: steps.gfx.outputs.found == 'true'
        timeout-minutes: 15
        run: |
          mg=launcher/.build/release/mg
          b="$MG_HOME/bottles/test/drive_c/windows"
          fail() { echo "::error::$*"; $mg logs --last || true; exit 1; }
          # A hang fails fast (macOS has no timeout(1); the alarm survives exec).
          t() { perl -e 'alarm shift; exec @ARGV or die "exec: $!"' 300 "$@"; }

          # DXMT: wine-dxmt/ runs, winemetal.dll lands in the prefix, everything else stays builtin.
          t $mg run --bottle test --backend dxmt cmd.exe /c echo mg-dxmt-ok || fail "mg run --backend dxmt exited $?"
          $mg logs --last | tee "$RUNNER_TEMP/run.log"
          grep -q mg-dxmt-ok "$RUNNER_TEMP/run.log" || fail "no cmd.exe output in the DXMT run log"
          grep -q "^# command: $RT/wine-dxmt/bin/wine " "$RUNNER_TEMP/run.log" || fail "DXMT run did not use wine-dxmt/"
          cmp "$RT/dxmt/x86_64-windows/winemetal.dll" "$b/system32/winemetal.dll" || fail "system32/winemetal.dll is not DXMT's"
          cmp "$RT/dxmt/i386-windows/winemetal.dll" "$b/syswow64/winemetal.dll" || fail "syswow64/winemetal.dll is not DXMT's"

          # DXVK: native DLLs land in system32 (x64) and syswow64 (x32).
          t $mg run --bottle test --backend dxvk cmd.exe /c echo mg-dxvk-ok || fail "mg run --backend dxvk exited $?"
          $mg logs --last | tee "$RUNNER_TEMP/run.log"
          grep -q mg-dxvk-ok "$RUNNER_TEMP/run.log" || fail "no cmd.exe output in the DXVK run log"
          for d in d3d9 d3d10core d3d11 dxgi; do
            cmp "$RT/dxvk/x64/$d.dll" "$b/system32/$d.dll" || fail "system32/$d.dll is not DXVK's"
            cmp "$RT/dxvk/x32/$d.dll" "$b/syswow64/$d.dll" || fail "syswow64/$d.dll is not DXVK's"
          done

          # Back to wined3d in the same bottle: DXVK's copies stay on disk but are pinned to builtin.
          t $mg run --bottle test --backend wined3d cmd.exe /c echo mg-wined3d-ok || fail "mg run --backend wined3d exited $?"
          $mg logs --last | grep -q mg-wined3d-ok || fail "no cmd.exe output in the wined3d run log"

      - name: Load each backend's d3d11.dll (no device, no rendering)
        if: steps.gfx.outputs.found == 'true'
        timeout-minutes: 10
        run: |
          # rundll32 loads the DLL (and its imports) and then finds no such entry point, so this
          # proves which d3d11.dll Wine picks without creating a device. +loaddll lists every load.
          mg=launcher/.build/release/mg
          fail() { echo "::error::$*"; exit 1; }
          t() { perl -e 'alarm shift; exec @ARGV or die "exec: $!"' 300 "$@"; }
          for rundll in rundll32.exe 'C:\windows\syswow64\rundll32.exe'; do
            t $mg run --bottle test --backend dxmt --debug +loaddll "$rundll" d3d11.dll,mgNoSuchEntry || true
            $mg logs --last > "$RUNNER_TEMP/load.log"
            grep -iE 'loaddll.*(d3d11|winemetal|wined3d)' "$RUNNER_TEMP/load.log" || true
            grep -iqE 'loaddll.*winemetal\.dll.*builtin' "$RUNNER_TEMP/load.log" || fail "[$rundll] DXMT: winemetal.dll was not loaded, so d3d11.dll is not DXMT's"
            if grep -iq 'loaddll.*wined3d\.dll' "$RUNNER_TEMP/load.log"; then fail "[$rundll] DXMT: Wine's own d3d11 (wined3d) was loaded"; fi

            t $mg run --bottle test --backend dxvk --debug +loaddll "$rundll" d3d11.dll,mgNoSuchEntry || true
            $mg logs --last > "$RUNNER_TEMP/load.log"
            grep -iE 'loaddll.*(d3d11|dxgi|wined3d)' "$RUNNER_TEMP/load.log" || true
            grep -iqE 'loaddll.*d3d11\.dll.*native' "$RUNNER_TEMP/load.log" || fail "[$rundll] DXVK: d3d11.dll was not loaded as native"
            if grep -iq 'loaddll.*wined3d\.dll' "$RUNNER_TEMP/load.log"; then fail "[$rundll] DXVK: Wine's own d3d11 (wined3d) was loaded"; fi
          done

      - name: Diagnostics report
        if: always() && steps.wine.outputs.found == 'true'
        run: |
          mg=launcher/.build/release/mg
          $mg doctor --json || true
          $mg report -o "$RUNNER_TEMP/mg/mg-report"
          find "$RUNNER_TEMP/mg/mg-report" -type f | sort
          cat "$RUNNER_TEMP/mg/mg-report/runtimes.txt"
          if [[ "${{ steps.gfx.outputs.found }}" == true ]]; then
            grep -q '^present: DXMT overlay winemetal.so' "$RUNNER_TEMP/mg/mg-report/runtimes.txt" || { echo "::error::mg report does not show the wine-dxmt overlay"; exit 1; }
          fi
          tar -czf "$RUNNER_TEMP/mg/mg-report.tar.gz" -C "$RUNNER_TEMP/mg" mg-report

      - name: Upload logs
        if: always() && steps.wine.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs
          path: |
            ${{ runner.temp }}/mg/logs
            ${{ runner.temp }}/mg/mg-report.tar.gz
          if-no-files-found: ignore
